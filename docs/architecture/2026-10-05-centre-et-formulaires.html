    switch (b.kind) {
      case 'measures':
        return '<div class="panel scroll"><table><tr><th>'+esc(b.head ? b.head[0] : 'Mesure')+'</th><th>'+esc(b.head ? b.head[1] : 'Valeur')+'</th></tr>'+
          b.rows.map(r=>'<tr><td>'+esc(r[0])+'</td><td class="num">'+esc(r[1])+'</td></tr>').join('')+'</table>'+(b.note?'<p style="margin:12px 0 0;font-size:14px;color:var(--muted)">'+esc(b.note)+'</p>':'')+'</div>';
      case 'table':
        return '<div class="panel scroll"><table><tr>'+b.head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr>'+
          b.rows.map(r=>'<tr>'+r.map((c,i)=>'<td'+(b.num && b.num.includes(i)?' class="num"':'')+'>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</table></div>';
      case 'diagram':
        return '<figure class="diagram">'+(b.svg||'')+(b.caption?'<figcaption>'+esc(b.caption)+'</figcaption>':'')+'</figure>';
      case 'options':
        return '<div class="grid g3">'+b.items.map(o=>'<div class="panel option"><h3><span class="tag prop">'+esc(o.tag)+'</span> '+esc(o.title)+(o.cost?' <span class="cost">'+esc(o.cost)+'</span>':'')+'</h3><p>'+esc(o.body)+'</p><ul>'+
          (o.gain||[]).map(g=>'<li class="gain">'+esc(g)+'</li>').join('')+(o.forbid||[]).map(f=>'<li class="forbid">'+esc(f)+'</li>').join('')+'</ul></div>').join('')+'</div>';
      case 'text':
        return '<div class="text">'+(b.paragraphs||[]).map(p=>'<p>'+esc(p)+'</p>').join('')+'</div>';
      case 'columns':
        return '<div class="grid g2">'+b.blocks.map(block).join('')+'</div>';
      default:
        return '<div class="panel">Bloc inconnu : '+esc(b.kind)+'</div>';
    }
  }
  function section(s, i){
    return '<h2>'+(i+1)+' · '+esc(s.heading)+'</h2>'+(s.blocks||[]).map(block).join('');
  }
  function questionBlock(q, i){
    const chosen = (ANS.choices && ANS.choices[q.id] != null) ? ANS.choices[q.id] : q.ratified;
    const opts = q.options.map(o=>'<label class="opt"><input type="radio" name="'+esc(q.id)+'" value="'+esc(o)+'"'+(chosen===o?' checked':'')+'> '+esc(o)+'</label>').join('');
    const rat = q.ratified ? '<span class="tag live" style="margin-left:8px">ratifié'+(q.ratified_on?' '+esc(q.ratified_on):'')+'</span>' : '<span class="tag acc" style="margin-left:8px">à trancher</span>';
    return '<div class="q" data-q="'+esc(q.id)+'"><div class="qt"><b>'+(i+1)+'.</b>'+esc(q.label)+rat+'</div><div class="opts">'+opts+'</div><textarea data-comment="'+esc(q.id)+'" placeholder="Remarque sur ce point (optionnel)">'+esc((ANS.comments||{})[q.id]||'')+'</textarea></div>';
  }
  function render(){
    const A = PLAN.arbitrages || {questions: []};
    const sentLine = ANS.sent ? '<div class="banner" id="sent-banner">Réponses envoyées le '+esc(ANS.sent)+(ANS.ack ? ' · <b>Reçues par Claude le '+esc(ANS.ack)+'</b>' : ' · en attente de lecture par Claude')+'. Modifier et renvoyer reste possible.</div>' : '';
    document.getElementById('app').innerHTML =
      '<main><div class="eyebrow">'+esc(PLAN.eyebrow||'')+'</div><h1>'+esc(PLAN.title)+'</h1><p class="question">'+esc(PLAN.question)+'</p>'+(PLAN.lede?'<p class="lede">'+esc(PLAN.lede)+'</p>':'')+sentLine+
      (PLAN.sections||[]).map(section).join('')+
      '<section class="arb"><h2>'+esc(A.heading||'Arbitrages qui t\'appartiennent')+'</h2><p class="sub">'+esc(A.intro||'Coche, commente si besoin, puis « Envoyer à Claude ». La page se republie avec tes réponses ; la session Claude est notifiée et les lit ici.')+'</p>'+
      (A.questions||[]).map(questionBlock).join('')+
      '<div class="q"><div class="qt"><b>+</b>'+esc(A.notes_label||'Remarques libres')+'</div><textarea id="notes" placeholder="Optionnel — vide = rien à ajouter.">'+esc(ANS.notes||'')+'</textarea></div>'+
      '<div class="send"><button class="primary" id="send">Envoyer à Claude</button><span class="status" id="status"></span></div></section>'+
      (PLAN.hors?'<p class="hors"><b>Hors scope</b> : '+esc(PLAN.hors)+'</p>':'')+'</main>';
    document.getElementById('send').addEventListener('click', send);
    detectReadOnly();
  }
  async function detectReadOnly(){
    let api = null;
    try { api = (window.claude && window.claude.use) ? await window.claude.use('artifact') : null; } catch(e){ api = null; }
    if (api) return;
    const link = PLAN.url ? '<a href="'+esc(PLAN.url)+'" target="_blank" rel="noopener">ouvrir la version interactive sur claude.ai</a>' : 'ouvrir le lien claude.ai de cette page';
    const b = document.createElement('div'); b.className = 'banner ro';
    b.innerHTML = '<b>Aperçu en lecture seule</b> (fichier local ou panneau VS Code) — pour répondre : '+link+'.';
    const main = document.querySelector('main'); main.insertBefore(b, main.firstChild);
    const btn = document.getElementById('send'); btn.disabled = true;
    document.getElementById('status').textContent = 'Réponse impossible dans cet aperçu.';
  }
  function collect(){
    const choices = {}, comments = {};
    ((PLAN.arbitrages||{}).questions||[]).forEach(q=>{
      const r = document.querySelector('input[name="'+CSS.escape(q.id)+'"]:checked'); if (r) choices[q.id] = r.value;
      const c = document.querySelector('textarea[data-comment="'+CSS.escape(q.id)+'"]'); if (c && c.value.trim()) comments[q.id] = c.value.trim();
    });
    const d = new Date(); const pad = n => String(n).padStart(2,'0');
    return {sent: d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes()), choices, comments, notes: document.getElementById('notes').value.trim()};
  }
  function buildDocument(plan, answers){
    const theme = document.getElementById('theme').textContent;
    const renderer = document.getElementById('renderer').textContent;
    const fonts = document.getElementById('fonts') ? document.getElementById('fonts').getAttribute('href') : '';
    const safe = s => s.replace(/<\/script/gi, '<\\/script');
    return '<!doctype html>\n<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>'+esc(plan.title)+'</title>'+
      (fonts?'<link id="fonts" rel="stylesheet" href="'+esc(fonts)+'">':'')+
      '<style id="theme">'+theme+'</style></head><body>'+
      '<script id="plan-data" type="application/json">'+safe(JSON.stringify(plan))+'<\/script>'+
      '<script id="plan-answers" type="application/json">'+safe(JSON.stringify(answers))+'<\/script>'+
      '<div id="app"></div><script id="renderer">'+safe(renderer)+'<\/script></body></html>';
  }
  async function send(){
    const btn = document.getElementById('send'), st = document.getElementById('status');
    const answers = collect();
    btn.disabled = true; st.className='status'; st.textContent='Publication…';
    let api = null;
    try { api = (window.claude && window.claude.use) ? await window.claude.use('artifact') : null; } catch(e){ api = null; }
    if (!api){ st.className='status err'; st.textContent='Cette vue est en lecture seule : ouvre le lien claude.ai pour répondre.'; btn.disabled=false; return; }
    try {
      await api.publish(buildDocument(PLAN, answers));
      st.className='status ok'; st.textContent='Envoyé à '+esc(answers.sent)+' — la page se rafraîchit (1 s) et affichera « Reçues par Claude » dès lecture.';
    } catch(e){
      const code = e && e.code;
      if (code === 'conflict'){ st.className='status'; st.textContent='Une version plus récente existe : la page se recharge.'; return; }
      if (code === 'not_writer' || code === 'not_granted' || code === 'not_declared'){ st.className='status err'; st.textContent='Lecture seule sur ce compte : impossible d\'envoyer.'; return; }
      st.className='status err'; st.textContent='Envoi impossible ('+esc(code||'erreur')+'). Tes réponses restent dans la page ; réessaie dans un instant.'; btn.disabled=false;
    }
  }
  render();
})();
</script>
