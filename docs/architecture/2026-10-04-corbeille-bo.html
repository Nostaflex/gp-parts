<meta charset="utf-8">
<title>Corbeille du back-office</title>
<link id="fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;600&display=swap">
<style id="theme">
:root{--bg:#F3F5F7;--panel:#FFFFFF;--ink:#14202B;--muted:#5B6B7A;--line:#D6DCE2;--accent:#C57A16;--accent-soft:#FBEFD9;--live:#2E7D5B;--live-soft:#E2F1E9;--dead:#B3392B;--dead-soft:#F7E1DD;--prop:#4A5FA8;--prop-soft:#E3E8F6;--code:#EEF1F4;--focus:#4A5FA8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0F161D;--panel:#172029;--ink:#E6ECF1;--muted:#9AA8B5;--line:#2A3641;--accent:#E39A3B;--accent-soft:#3A2B14;--live:#5FBF93;--live-soft:#16302A;--dead:#E0695A;--dead-soft:#3A1E1A;--prop:#8FA3E6;--prop-soft:#1F2740;--code:#101820;--focus:#8FA3E6}}
:root[data-theme="dark"]{--bg:#0F161D;--panel:#172029;--ink:#E6ECF1;--muted:#9AA8B5;--line:#2A3641;--accent:#E39A3B;--accent-soft:#3A2B14;--live:#5FBF93;--live-soft:#16302A;--dead:#E0695A;--dead-soft:#3A1E1A;--prop:#8FA3E6;--prop-soft:#1F2740;--code:#101820;--focus:#8FA3E6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.55}
main{max-width:1080px;margin:0 auto;padding:40px 24px 80px}
h1,h2,h3{font-family:"Geist",sans-serif;text-wrap:balance;line-height:1.15;margin:0;letter-spacing:-.01em}
h1{font-size:2.3rem;font-weight:700}
h2{font-size:1.45rem;font-weight:600;margin-top:48px;padding-top:18px;border-top:1px solid var(--line)}
h3{font-size:1.05rem;font-weight:600}
p{max-width:68ch}
.mono,.eyebrow,th,.tag,.cost,td.num,code,pre{font-family:"Geist Mono",ui-monospace,monospace}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.question{margin:14px 0 0;font-size:1.2rem;font-weight:600;max-width:none}
.lede{color:var(--muted);margin-top:8px}
.tag{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tag.live{color:var(--ink);border-color:var(--live);background:var(--live-soft)}
.tag.dead{color:var(--ink);border-color:var(--dead);background:var(--dead-soft)}
.tag.prop{color:var(--ink);border-color:var(--prop);background:var(--prop-soft)}
.tag.acc{color:var(--ink);border-color:var(--accent);background:var(--accent-soft)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.option h3{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.option .cost{font-size:12px;color:var(--muted);white-space:nowrap}
.option p{font-size:15px}
.option ul{margin:10px 0 0 18px;padding:0}
.option li{margin:6px 0}
.option .forbid{color:var(--dead)}
.option .gain{color:var(--live)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
code{background:var(--code);padding:1px 5px;border-radius:4px;font-size:.88em}
.text{max-width:none}
.text p{max-width:72ch}
.diagram{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;overflow-x:auto}
.diagram svg{width:auto;max-width:100%;height:auto;display:block;margin:0 auto}
.diagram figcaption{margin-top:8px;font-size:14px;color:var(--muted)}
.arb{margin-top:28px;border:2px solid var(--accent);border-radius:12px;padding:20px 22px;background:var(--accent-soft)}
.arb h2{border:0;margin:0;padding:0;font-size:1.3rem}
.arb .sub{color:var(--muted);font-size:14px;margin:6px 0 14px}
.q{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:12px}
.q .qt{font-weight:600;margin-bottom:8px}
.q .qt b{color:var(--accent);margin-right:6px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14.5px;background:var(--bg)}
.opt:has(input:checked){border-color:var(--prop);background:var(--prop-soft);color:var(--ink)}
.opt input{accent-color:var(--prop);margin:0}
.opt:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.q textarea,.arb textarea{width:100%;min-height:64px;margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;font-size:14.5px;background:var(--bg);color:var(--ink);resize:vertical}
.arb textarea{min-height:110px}
textarea:focus{outline:2px solid var(--focus);outline-offset:1px}
.send{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:16px}
button.primary{font:inherit;font-weight:600;font-size:15px;padding:10px 18px;border-radius:10px;border:0;background:var(--accent);color:#14202B;cursor:pointer}
button.primary:disabled{opacity:.5;cursor:not-allowed}
button.primary:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.status{font-size:14px;color:var(--muted)}
.status.ok{color:var(--live)}
.status.err{color:var(--dead)}
.hors{margin-top:24px;color:var(--muted);font-size:15px}
.banner.ro{margin-top:0;margin-bottom:16px;border:1px solid var(--dead);background:var(--dead-soft)}
.banner a{color:var(--prop);font-weight:600}
.banner{margin-top:14px;padding:10px 14px;border-radius:8px;background:var(--prop-soft);color:var(--ink);font-size:14px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

)'>Dacia Sandero Essential\u003c/text>\u003ctext x='22' y='159' font-size='12' fill='var(--muted)'>Supprimée le 4 oct. · était « Disponible »\u003c/text>\u003ctext x='296' y='149' font-weight='600' fill='var(--prop)'>Restaurer\u003c/text>\u003ctext x='372' y='149' font-weight='600' fill='var(--muted)'>Éditer\u003c/text>\u003cline x1='22' y1='176' x2='412' y2='176' stroke='var(--line)'/>\u003ctext x='22' y='202' font-weight='600' fill='var(--ink)'>Renault Clio V Intens\u003c/text>\u003ctext x='22' y='221' font-size='12' fill='var(--muted)'>Supprimée le 28 sept. · était « Vendu »\u003c/text>\u003ctext x='296' y='211' font-weight='600' fill='var(--prop)'>Restaurer\u003c/text>\u003ctext x='372' y='211' font-weight='600' fill='var(--muted)'>Éditer\u003c/text>\u003cline x1='22' y1='238' x2='412' y2='238' stroke='var(--line)'/>\u003ctext x='22' y='270' font-size='12' fill='var(--muted)'>Les éléments de la corbeille n'apparaissent nulle part sur le site.\u003c/text>\u003crect x='86' y='304' width='260' height='40' rx='11' fill='var(--ink)'/>\u003ctext x='106' y='329' fill='var(--panel)'>Annonce supprimée\u003c/text>\u003ctext x='330' y='329' text-anchor='end' font-weight='700' fill='var(--accent-soft)'>Annuler\u003c/text>\u003crect x='456' y='1' width='303' height='210' rx='14' fill='var(--panel)' stroke='var(--line)'/>\u003ctext x='476' y='36' font-size='17' font-weight='700' fill='var(--ink)'>Dacia Sandero Essential\u003c/text>\u003crect x='476' y='52' width='263' height='74' rx='10' fill='var(--accent-soft)' stroke='var(--accent)'/>\u003ctext x='490' y='76' font-weight='700' fill='var(--ink)'>Dans la corbeille\u003c/text>\u003ctext x='490' y='95' font-size='12' fill='var(--ink)'>Invisible sur le site.\u003c/text>\u003ctext x='490' y='111' font-size='12' fill='var(--ink)'>Tu peux la modifier, puis la restaurer.\u003c/text>\u003crect x='640' y='60' width='88' height='28' rx='8' fill='var(--prop)'/>\u003ctext x='684' y='79' text-anchor='middle' font-weight='600' fill='var(- <div id="app"></div>
<script id="renderer">
(function(){
  const PLAN = JSON.parse(document.getElementById('plan-data').textContent);
  const ANS = JSON.parse(document.getElementById('plan-answers').textContent);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function block(b){
    switch (b.kind) {
      case 'measures':
        return '<div class="panel scroll"><table><tr><th>'+esc(b.head ? b.head[0] : 'Mesure')+'</th><th>'+esc(b.head ? b.head[1] : 'Valeur')+'</th></tr>'+
          b.rows.map(r=>'<tr><td>'+esc(r[0])+'</td><td class="num">'+esc(r[1])+'</td></tr>').join('')+'</table>'+(b.note?'<p style="margin:12px 0 0;font-size:14px;color:var(--muted)">'+esc(b.note)+'</p>':'')+'</div>';
      case 'table':
        return '<div class="panel scroll"><table><tr>'+b.head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr>'+
          b.rows.map(r=>'<tr>'+r.map((c,i)=>'<td'+(b.num && b.num.includes(i)?' class="num"':'')+'>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</table></div>';
      case 'diagram':
        return '<figure class="diagram">'+(b.svg||'')+(b.caption?'<figcaption>'+esc(b.caption)+'</figcaption>':'')+'</figure>';
      case 'options':
        return '<div class="grid g3">'+b.items.map(o=>'<div class="panel option"><h3><span class="tag prop">'+esc(o.tag)+'</span> '+esc(o.title)+(o.cost?' <span class="cost">'+esc(o.cost)+'</span>':'')+'</h3><p>'+esc(o.body)+'</p><ul>'+
          (o.gain||[]).map(g=>'<li class="gain">'+esc(g)+'</li>').join('')+(o.forbid||[]).map(f=>'<li class="forbid">'+esc(f)+'</li>').join('')+'</ul></div>').join('')+'</div>';
      case 'text':
        return '<div class="text">'+(b.paragraphs||[]).map(p=>'<p>'+esc(p)+'</p>').join('')+'</div>';
      case 'columns':
        return '<div class="grid g2">'+b.blocks.map(block).join('')+'</div>';
      default:
        return '<div class="panel">Bloc inconnu : '+esc(b.kind)+'</div>';
    }
  }
  function section(s, i){
    return '<h2>'+(i+1)+' · '+esc(s.heading)+'</h2>'+(s.blocks||[]).map(block).join('');
  }
  function questionBlock(q, i){
    const chosen = (ANS.choices && ANS.choices[q.id] != null) ? ANS.choices[q.id] : q.ratified;
    const opts = q.options.map(o=>'<label class="opt"><input type="radio" name="'+esc(q.id)+'" value="'+esc(o)+'"'+(chosen===o?' checked':'')+'> '+esc(o)+'</label>').join('');
    const rat = q.ratified ? '<span class="tag live" style="margin-left:8px">ratifié'+(q.ratified_on?' '+esc(q.ratified_on):'')+'</span>' : '<span class="tag acc" style="margin-left:8px">à trancher</span>';
    return '<div class="q" data-q="'+esc(q.id)+'"><div class="qt"><b>'+(i+1)+'.</b>'+esc(q.label)+rat+'</div><div class="opts">'+opts+'</div><textarea data-comment="'+esc(q.id)+'" placeholder="Remarque sur ce point (optionnel)">'+esc((ANS.comments||{})[q.id]||'')+'</textarea></div>';
  }
  function render(){
    const A = PLAN.arbitrages || {questions: []};
    const sentLine = ANS.sent ? '<div class="banner" id="sent-banner">Réponses envoyées le '+esc(ANS.sent)+(ANS.ack ? ' · <b>Reçues par Claude le '+esc(ANS.ack)+'</b>' : ' · en attente de lecture par Claude')+'. Modifier et renvoyer reste possible.</div>' : '';
    document.getElementById('app').innerHTML =
      '<main><div class="eyebrow">'+esc(PLAN.eyebrow||'')+'</div><h1>'+esc(PLAN.title)+'</h1><p class="question">'+esc(PLAN.question)+'</p>'+(PLAN.lede?'<p class="lede">'+esc(PLAN.lede)+'</p>':'')+sentLine+
      (PLAN.sections||[]).map(section).join('')+
      '<section class="arb"><h2>'+esc(A.heading||'Arbitrages qui t\'appartiennent')+'</h2><p class="sub">'+esc(A.intro||'Coche, commente si besoin, puis « Envoyer à Claude ». La page se republie avec tes réponses ; la session Claude est notifiée et les lit ici.')+'</p>'+
      (A.questions||[]).map(questionBlock).join('')+
      '<div class="q"><div class="qt"><b>+</b>'+esc(A.notes_label||'Remarques libres')+'</div><textarea id="notes" placeholder="Optionnel — vide = rien à ajouter.">'+esc(ANS.notes||'')+'</textarea></div>'+
      '<div class="send"><button class="primary" id="send">Envoyer à Claude</button><span class="status" id="status"></span></div></section>'+
      (PLAN.hors?'<p class="hors"><b>Hors scope</b> : '+esc(PLAN.hors)+'</p>':'')+'</main>';
    document.getElementById('send').addEventListener('click', send);
    detectReadOnly();
  }
  async function detectReadOnly(){
    let api = null;
    try { api = (window.claude && window.claude.use) ? await window.claude.use('artifact') : null; } catch(e){ api = null; }
    if (api) return;
    const link = PLAN.url ? '<a href="'+esc(PLAN.url)+'" target="_blank" rel="noopener">ouvrir la version interactive sur claude.ai</a>' : 'ouvrir le lien claude.ai de cette page';
    const b = document.createElement('div'); b.className = 'banner ro';
    b.innerHTML = '<b>Aperçu en lecture seule</b> (fichier local ou panneau VS Code) — pour répondre : '+link+'.';
    const main = document.querySelector('main'); main.insertBefore(b, main.firstChild);
    const btn = document.getElementById('send'); btn.disabled = true;
    document.getElementById('status').textContent = 'Réponse impossible dans cet aperçu.';
  }
  function collect(){
    const choices = {}, comments = {};
    ((PLAN.arbitrages||{}).questions||[]).forEach(q=>{
      const r = document.querySelector('input[name="'+CSS.escape(q.id)+'"]:checked'); if (r) choices[q.id] = r.value;
      const c = document.querySelector('textarea[data-comment="'+CSS.escape(q.id)+'"]'); if (c && c.value.trim()) comments[q.id] = c.value.trim();
    });
    const d = new Date(); const pad = n => String(n).padStart(2,'0');
    return {sent: d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes()), choices, comments, notes: document.getElementById('notes').value.trim()};
  }
  function buildDocument(plan, answers){
    const theme = document.getElementById('theme').textContent;
    const renderer = document.getElementById('renderer').textContent;
    const fonts = document.getElementById('fonts') ? document.getElementById('fonts').getAttribute('href') : '';
    const safe = s => s.replace(/<\/script/gi, '<\\/script');
    return '<!doctype html>\n<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>'+esc(plan.title)+'</title>'+
      (fonts?'<link id="fonts" rel="stylesheet" href="'+esc(fonts)+'">':'')+
      '<style id="theme">'+theme+'</style></head><body>'+
      '<script id="plan-data" type="application/json">'+safe(JSON.stringify(plan))+'<\/script>'+
      '<script id="plan-answers" type="application/json">'+safe(JSON.stringify(answers))+'<\/script>'+
      '<div id="app"></div><script id="renderer">'+safe(renderer)+'<\/script></body></html>';
  }
  async function send(){
    const btn = document.getElementById('send'), st = document.getElementById('status');
    const answers = collect();
    btn.disabled = true; st.className='status'; st.textContent='Publication…';
    let api = null;
    try { api = (window.claude && window.claude.use) ? await window.claude.use('artifact') : null; } catch(e){ api = null; }
    if (!api){ st.className='status err'; st.textContent='Cette vue est en lecture seule : ouvre le lien claude.ai pour répondre.'; btn.disabled=false; return; }
    try {
      await api.publish(buildDocument(PLAN, answers));
      st.className='status ok'; st.textContent='Envoyé à '+esc(answers.sent)+' — la page se rafraîchit (1 s) et affichera « Reçues par Claude » dès lecture.';
    } catch(e){
      const code = e && e.code;
      if (code === 'conflict'){ st.className='status'; st.textContent='Une version plus récente existe : la page se recharge.'; return; }
      if (code === 'not_writer' || code === 'not_granted' || code === 'not_declared'){ st.className='status err'; st.textContent='Lecture seule sur ce compte : impossible d\'envoyer.'; return; }
      st.className='status err'; st.textContent='Envoi impossible ('+esc(code||'erreur')+'). Tes réponses restent dans la page ; réessaie dans un instant.'; btn.disabled=false;
    }
  }
  render();
})();
</script>
